# Workflow to show how to develop workflows in branches

name: Develop in a branch

on: [pull_request, workflow_dispatch]

jobs:
  job1:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Step 1: Fetch repository files
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Lint workflow files
      - name: Lint Workflow Files
        uses: raven-actions/actionlint@v2

      # Step 3: Output GitHub context metadata
      - name: Output Context Metadata
        run: |
          echo "Workflow triggered in branch '${{ github.ref }}'."
          echo "Workflow triggered by event '${{ github.event_name }}'."
          echo "Workflow triggered by actor '${{ github.actor }}'."

      # Step 4: Print Pull Request title
      - name: Print Pull Request Title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Demo PR title is '$PR_TITLE'."
